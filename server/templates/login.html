{% extends "base.html" %}
{% block title %}Welcome · ResourceHub{% endblock %}

{% block fullpage %}
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo-mark large">RH</div>
      <h1>ResourceHub</h1>
      <p class="muted">Plan. Track. Deliver.</p>
    </div>

    {% if error %}
      <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <p style="text-align:center; margin-bottom:1.2em;">Select your role to continue:</p>

    <form method="post" action="/login" class="form">
      <div style="display:flex; flex-direction:column; gap:.75em;">
        {% for role in roles %}
        <button type="submit" name="role" value="{{ role.value }}"
                class="btn btn-primary btn-block"
                style="text-align:left; padding:.8em 1.2em;">
          <strong>{{ role.label }}</strong>
          <br><small class="muted">{{ role.description }}</small>
        </button>
        {% endfor %}
      </div>
    </form>
  </div>
</div>
{% endblock %}
